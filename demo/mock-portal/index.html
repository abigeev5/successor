<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Учебный портал (демо)</title>
    <!-- Fictional portal for demo screen recordings (SPEC 13.2). All people and data are made up. -->
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.45 Arial, Helvetica, sans-serif; color: #222; background: #eef1f4; }
      header { background: #3b5266; color: #fff; padding: 10px 20px; display: flex; align-items: baseline; gap: 16px; }
      header b { font-size: 18px; }
      header span { opacity: .8; font-size: 13px; }
      nav { display: flex; gap: 2px; padding: 0 20px; background: #d5dde4; }
      nav button { border: 0; background: none; padding: 10px 16px; font: inherit; cursor: pointer; color: #34495e; }
      nav button.on { background: #fff; font-weight: bold; }
      main { max-width: 980px; margin: 18px auto; background: #fff; padding: 20px 24px; border: 1px solid #c9d2da; min-height: 480px; }
      h2 { margin: 0 0 14px; font-size: 19px; color: #2c3e50; }
      label { display: block; margin: 10px 0 4px; font-weight: bold; font-size: 13px; }
      input, select { font: inherit; padding: 6px 8px; border: 1px solid #9fb0bf; width: 320px; }
      .btn { background: #3b7dd8; color: #fff; border: 0; padding: 7px 18px; font: inherit; cursor: pointer; margin-top: 12px; }
      .btn.grey { background: #7f8c8d; }
      table { border-collapse: collapse; width: 100%; margin-top: 14px; }
      th, td { border: 1px solid #c9d2da; padding: 6px 8px; text-align: left; }
      th { background: #f0f3f6; }
      tr.link { cursor: pointer; }
      tr.link:hover { background: #f5f9ff; }
      .card { display: grid; grid-template-columns: 220px 1fr; gap: 6px 12px; margin-top: 8px; }
      .card div:nth-child(odd) { color: #667; }
      .ok { color: #1e7e34; font-weight: bold; }
      .warn { color: #b03a2e; font-weight: bold; }
      .note { background: #fff8dc; border: 1px solid #e5d58c; padding: 10px 12px; margin-top: 16px; }
      .hidden { display: none; }
      footer { text-align: center; font-size: 12px; color: #889; margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <header><b>Учебный портал (демо)</b><span>Учебный отдел · сотрудник: Ирина Сергеевна</span></header>
    <nav>
      <button data-tab="search" class="on">Поиск студента</button>
      <button data-tab="retake">Направление на пересдачу</button>
      <button data-tab="sheets">Ведомости</button>
    </nav>
    <main>
      <section id="search">
        <h2>Поиск студента</h2>
        <label for="q">Фамилия или номер зачётной книжки</label>
        <input id="q" placeholder="например, Смирнова" />
        <button class="btn" id="find">Найти</button>
        <table id="results" class="hidden">
          <thead><tr><th>ФИО</th><th>Группа</th><th>Статус</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="student" class="hidden">
          <h2 style="margin-top: 22px">Карточка студента</h2>
          <div class="card" id="student-card"></div>
          <button class="btn" id="to-retake">Оформить направление на пересдачу</button>
        </div>
      </section>

      <section id="retake" class="hidden">
        <h2>Направление на пересдачу</h2>
        <label>Студент</label>
        <input id="r-student" readonly placeholder="выберите студента в поиске" />
        <label for="r-discipline">Дисциплина (по учебному плану)</label>
        <select id="r-discipline"><option value="">— выберите —</option></select>
        <label for="r-teacher">Преподаватель</label>
        <input id="r-teacher" placeholder="Фамилия И. О." />
        <label for="r-date">Дата пересдачи</label>
        <input id="r-date" type="date" />
        <br />
        <button class="btn" id="issue">Оформить</button>
        <div id="issued" class="note hidden"></div>
      </section>

      <section id="sheets" class="hidden">
        <h2>Экзаменационные ведомости</h2>
        <label for="s-group">Группа</label>
        <select id="s-group"><option>ЭК-21</option><option>ЭК-22</option></select>
        <label for="s-discipline">Дисциплина</label>
        <select id="s-discipline"><option>Математический анализ</option><option>Микроэкономика</option></select>
        <br />
        <button class="btn" id="make-sheet">Сформировать</button>
        <table id="sheet" class="hidden">
          <thead><tr><th>№</th><th>ФИО</th><th>Статус</th><th>Оценка</th><th>Подпись</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
    <footer>Демо-стенд. Все люди, телефоны и адреса вымышленные.</footer>

    <script>
      const STUDENTS = [
        { id: 1, name: "Смирнова Анна Павловна", group: "ЭК-21", status: "обучается", book: "2021-0153",
          phone: "+7 (912) 345-67-89", email: "anna.smirnova@student.demo", debt: "нет", attempt: 2,
          disciplines: ["Математический анализ", "Микроэкономика"] },
        { id: 2, name: "Смирнов Олег Игоревич", group: "ЭК-22", status: "академический отпуск", book: "2021-0177",
          phone: "+7 (922) 111-22-33", email: "o.smirnov@student.demo", debt: "нет", attempt: 1,
          disciplines: ["Микроэкономика"] },
        { id: 3, name: "Кузнецов Павел Андреевич", group: "ЭК-21", status: "обучается", book: "2021-0161",
          phone: "+7 (908) 765-43-21", email: "p.kuznetsov@student.demo", debt: "есть", attempt: 1,
          disciplines: [] },
        { id: 4, name: "Лебедева Мария Олеговна", group: "ЭК-21", status: "отчислена", book: "2021-0149",
          phone: "+7 (950) 200-30-40", email: "m.lebedeva@student.demo", debt: "нет", attempt: 1,
          disciplines: [] },
      ];
      let current = null;
      const $ = (id) => document.getElementById(id);

      function show(tab) {
        document.querySelectorAll("main section").forEach((s) => s.classList.toggle("hidden", s.id !== tab));
        document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
      }
      document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => show(b.dataset.tab)));

      $("find").onclick = () => {
        const q = $("q").value.trim().toLowerCase();
        const rows = STUDENTS.filter((s) => s.name.toLowerCase().includes(q) || s.book.includes(q));
        $("results").tBodies[0].innerHTML = rows
          .map((s) => `<tr class="link" data-id="${s.id}"><td>${s.name}</td><td>${s.group}</td><td>${s.status}</td></tr>`)
          .join("") || `<tr><td colspan="3">Никого не нашлось</td></tr>`;
        $("results").classList.remove("hidden");
        $("student").classList.add("hidden");
        document.querySelectorAll("#results tr.link").forEach((tr) => (tr.onclick = () => openStudent(+tr.dataset.id)));
      };

      function openStudent(id) {
        current = STUDENTS.find((s) => s.id === id);
        const third = current.attempt >= 2 ? "следующая — третья, только комиссия" : "следующая — вторая";
        const debt = current.debt === "нет" ? `<span class="ok">нет</span>` : `<span class="warn">есть</span>`;
        $("student-card").innerHTML = [
          ["ФИО", current.name], ["Группа", current.group], ["Статус", current.status],
          ["Зачётная книжка", current.book], ["Телефон", current.phone], ["Почта", current.email],
          ["Финансовая задолженность", debt],
          ["Академические задолженности", current.disciplines.join(", ") || "нет"],
          ["Попыток пересдачи", `${current.attempt - 1} (${third})`],
        ].map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join("");
        $("student").classList.remove("hidden");
      }

      $("to-retake").onclick = () => {
        $("r-student").value = `${current.name}, ${current.group}`;
        $("r-discipline").innerHTML = `<option value="">— выберите —</option>` +
          current.disciplines.map((d) => `<option>${d}</option>`).join("");
        $("issued").classList.add("hidden");
        show("retake");
      };

      $("issue").onclick = () => {
        if (!current || !$("r-discipline").value || !$("r-teacher").value || !$("r-date").value) {
          alert("Заполните все поля");
          return;
        }
        const until = new Date($("r-date").value);
        until.setDate(until.getDate() + 10);
        $("issued").innerHTML = `Направление <b>№ 2026-0153</b> оформлено: ${current.name}, «${$("r-discipline").value}», ` +
          `преподаватель ${$("r-teacher").value}. Действует до <b>${until.toLocaleDateString("ru-RU")}</b>.` +
          `<br /><button class="btn grey" onclick="window.print()">Печать</button>`;
        $("issued").classList.remove("hidden");
      };

      $("make-sheet").onclick = () => {
        const group = $("s-group").value;
        const rows = STUDENTS.filter((s) => s.group === group && s.status === "обучается");
        $("sheet").tBodies[0].innerHTML = rows
          .map((s, i) => `<tr><td>${i + 1}</td><td>${s.name}</td><td>${s.status}</td><td></td><td></td></tr>`)
          .join("");
        $("sheet").classList.remove("hidden");
      };
    </script>
  </body>
</html>
