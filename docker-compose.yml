name: preemnik

x-backend: &backend
  image: preemnik-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://preemnik:${POSTGRES_PASSWORD:-preemnik}@db:5432/preemnik
    STORAGE_DIR: /data
  volumes:
    - appdata:/data
    - models:/home/app/.cache/huggingface  # faster-whisper weights survive rebuilds
  extra_hosts:
    - "host.docker.internal:host-gateway"  # llama-server runs on the host (D-033); Linux needs this line
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: preemnik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preemnik}
      POSTGRES_DB: preemnik
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preemnik"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy  # backend applies migrations first

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./demo/mock-portal:/usr/share/nginx/html/mock-portal:ro  # demo portal for screen recordings
    depends_on:
      - backend
    restart: unless-stopped

  # --- Profile local-llm: models inside the contour, in containers (D-027, D-033) ---
  # docker compose --profile local-llm up -d (make up-local-llm). GGUF files are taken from ./models;
  # in .env: LLM_BASE_URL=http://llm:8080/v1, EMBEDDINGS_BASE_URL=http://embeddings:8080/v1.
  # The default image runs on CPU; for an NVIDIA GPU set LLAMA_CPP_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda
  # and add a GPU reservation. On macOS keep llama-server on the host (Docker has no access to Metal).
  llm:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["local-llm"]
    command: ["-m", "/models/${LLM_GGUF:-llm.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "16384", "--jinja"]
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  embeddings:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["local-llm"]
    command: ["-m", "/models/${EMBEDDINGS_GGUF:-bge-m3.gguf}", "--host", "0.0.0.0", "--port", "8080", "--embeddings", "--pooling", "cls"]
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  models:
