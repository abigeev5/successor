[project]
name = "preemnik-backend"
version = "0.1.0"
description = "Преемник — платформа передачи дел (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations dir) must not make the alembic package look first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL (TEST_DATABASE_URL)"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Modules import only downward (docs/architecture.md, 3.2)"
type = "layers"
layers = [
    "app.modules.handovers",
    "app.modules.org",
    "app.modules.identity",
    "app.modules.audit",
]

[[tool.importlinter.contracts]]
name = "Platform does not depend on modules"
type = "forbidden"
source_modules = ["app.core", "app.providers"]
forbidden_modules = ["app.modules"]
